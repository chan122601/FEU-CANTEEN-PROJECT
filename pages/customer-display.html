<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FEU Canteen | Customer Display</title><link rel="stylesheet" href="../css/style.css"><style>body{margin:0;background:#F5F7F6;color:#1F2937;font-family:Arial,sans-serif}.display{max-width:1000px;margin:5vh auto;padding:32px}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #D4AF37;padding-bottom:20px}.head h1{color:#0B5D3B;margin:0}.items{margin:24px 0}.item{display:grid;grid-template-columns:1fr auto auto;gap:32px;padding:18px 10px;border-bottom:1px solid #e1e8e3;font-size:clamp(18px,3vw,28px)}.total{display:flex;justify-content:space-between;padding:24px;background:#0B5D3B;color:white;border-radius:14px;font-size:clamp(24px,4vw,38px);font-weight:bold}.empty{text-align:center;color:#627267;padding:15vh 0;font-size:24px}@media(max-width:600px){.display{padding:18px}.item{gap:12px}.head h1{font-size:22px}}</style>    <link rel="stylesheet" href="../css/canteen_theme.css">
</head><body><main class="display"><header class="head"><div><h1>FEU CANTEEN</h1><p>CURRENT ORDER</p></div></header><section id="items" class="items"></section><div class="total"><strong>TOTAL</strong><span id="total">&#8369;0.00</span></div></main><script>function render(){let a=[];try{a=JSON.parse(localStorage.getItem("feuCanteenCurrentOrder")||"[]")}catch{};const host=document.getElementById("items");if(!a.length){host.innerHTML="<div class=empty>Your order will appear here.</div>";document.getElementById("total").textContent="\u20B10.00";return}host.innerHTML=a.map(x=>`<div class="item"><strong><span aria-hidden="true">&#127869; </span>${String(x.name).replace(/[<>]/g,"")}</strong><span>\u00D7 ${Number(x.quantity)}</span><span>\u20B1${(Number(x.subtotal)||0).toFixed(2)}</span></div>`).join("");document.getElementById("total").textContent="\u20B1"+a.reduce((n,x)=>n+(Number(x.subtotal)||0),0).toFixed(2)}window.addEventListener("storage",e=>{if(e.key==="feuCanteenCurrentOrder")render()});render();</script></body></html>
